<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>American Sports Universe 2D</title>
<style>
  /* SportsUniverse shell: one always-visible sport switcher. Each sport is its own app in its own document
     (iframe), so engines, globals and requestAnimationFrame loops never mix; switching unloads the previous sport. */
  :root{--bg:#070b11;--line:#1f2d3f;--line2:#2b3d54;--text:#e9f0f7;--muted:#8295aa;--nfl:#2fe08f;--nhl:#5cc8ff;--mlb:#ff7a59}
  *{box-sizing:border-box}html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:13px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
  .su-bar{height:42px;flex:none;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0c131d,#070b11);z-index:10}
  .su-brand{font-weight:900;letter-spacing:.08em;font-size:12px;text-transform:uppercase;color:#c6d4e3;white-space:nowrap}
  .su-brand span{color:var(--muted);font-weight:600}
  .su-seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
  .su-seg a{padding:6px 18px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-decoration:none;font-size:12.5px}
  .su-seg a+a{border-left:1px solid var(--line2)}
  .su-seg a:hover{color:#fff;background:#141f2d}
  .su-seg a.on[data-sport=nfl]{background:rgba(47,224,143,.16);color:#c9ffe4;box-shadow:inset 0 -2px 0 var(--nfl)}
  .su-seg a.on[data-sport=nhl]{background:rgba(92,200,255,.16);color:#d6f1ff;box-shadow:inset 0 -2px 0 var(--nhl)}
  .su-seg a.on[data-sport=mlb]{background:rgba(255,122,89,.16);color:#ffe1d8;box-shadow:inset 0 -2px 0 var(--mlb)}
  .su-grow{flex:1}.su-hint{color:var(--muted);font-size:11px}
  #sportFrame{flex:1;width:100%;border:0;display:block;background:var(--bg)}
  .su-audio{position:relative}
  .su-audio>button{background:#0f1824;border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:5px 10px;font:inherit;cursor:pointer}
  .su-audio>button:hover{background:#162233}
  .su-pop{position:absolute;right:0;top:36px;width:270px;background:#0c131d;border:1px solid var(--line2);border-radius:10px;padding:12px 14px;box-shadow:0 12px 32px rgba(0,0,0,.5);display:none}
  .su-pop.show{display:block}
  .su-pop h4{margin:0 0 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .su-pop label{display:grid;grid-template-columns:110px 1fr 34px;align-items:center;gap:8px;margin:6px 0;font-size:12px}
  .su-pop input[type=range]{width:100%;accent-color:#5cc8ff}
  .su-pop .su-mute{display:flex;gap:8px;align-items:center;margin-top:8px;grid-template-columns:none}
  .su-pop small{color:var(--muted);display:block;margin-top:8px;font-size:10.5px;line-height:1.35}
  @media (max-width:560px){.su-brand span,.su-hint{display:none}.su-seg a{padding:6px 12px}}
</style>
</head>
<body>
<header class="su-bar">
  <div class="su-brand">American Sports Universe <span>2D</span></div>
  <nav class="su-seg" aria-label="Esporte"><a href="#nfl" data-sport="nfl">NFL</a><a href="#nhl" data-sport="nhl">NHL</a><a href="#mlb" data-sport="mlb">MLB</a></nav>
  <span class="su-grow"></span><span class="su-hint" id="suHint"></span>
  <div class="su-audio"><button id="suAudioBtn" title="Áudio: volumes por categoria">🔊</button><div class="su-pop" id="suAudioPop"></div></div>
</header>
<iframe id="sportFrame" title="Universo do esporte"></iframe>
<script>
(() => {
  const SPORTS = { nfl: { path: 'nfl/index.html', label: 'NFL Universe 2D' }, nhl: { path: 'nhl/index.html', label: 'NHL Universe 2D' }, mlb: { path: 'mlb/index.html', label: 'MLB Universe 2D' } };
  const frame = document.getElementById('sportFrame');
  const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* private mode */ } } };
  let current = null;
  // Remember the screen (inner hash) of each sport so NFL → NHL → NFL returns where you were.
  function rememberInner() {
    if (!current) return;
    try { const h = frame.contentWindow.location.hash; if (h) store.set('asu_inner_' + current, h); } catch { /* not loaded yet */ }
  }
  function show(sport) {
    if (!SPORTS[sport]) sport = 'nfl';
    if (sport === current) return;
    rememberInner();
    current = sport;
    store.set('asu_sport', sport);
    document.querySelectorAll('.su-seg a').forEach(a => a.classList.toggle('on', a.dataset.sport === sport));
    document.getElementById('suHint').textContent = SPORTS[sport].label;
    document.title = SPORTS[sport].label + ' — American Sports Universe';
    // A fresh document per sport: the previous sport's loops/timers are torn down with its page.
    frame.src = SPORTS[sport].path + (store.get('asu_inner_' + sport) || '');
  }
  window.addEventListener('hashchange', () => show(location.hash.slice(1)));
  window.addEventListener('beforeunload', rememberInner);
  const initial = location.hash.slice(1) || store.get('asu_sport') || 'nfl';
  if (location.hash.slice(1) !== initial) history.replaceState(null, '', '#' + initial);
  show(initial);
  window.__asu = { get sport() { return current; }, frame };
})();
</script>
<script type="module">
  // Audio settings (shared by the three sports through localStorage + storage events). No sound plays here.
  import { CATEGORIES, CATEGORY_LABELS, loadAudioSettings, saveAudioSettings } from './core/audio/audioEngine.js';
  const btn = document.getElementById('suAudioBtn'), pop = document.getElementById('suAudioPop');
  const draw = () => {
    const st = loadAudioSettings();
    btn.textContent = st.muted || st.master === 0 ? '🔇' : '🔊';
    pop.innerHTML = '<h4>Áudio</h4>' + ['master', ...CATEGORIES].map(k => `<label>${CATEGORY_LABELS[k]}<input type="range" min="0" max="100" data-k="${k}" value="${Math.round(st[k] * 100)}"><span>${Math.round(st[k] * 100)}</span></label>`).join('')
      + `<label class="su-mute"><input type="checkbox" id="suMute" ${st.muted ? 'checked' : ''}> Silenciar tudo</label><small>Sons sintetizados localmente (WebAudio). Narração por voz usa as vozes do navegador e é ligada no painel Live Commentary.</small>`;
  };
  pop.addEventListener('input', e => {
    const k = e.target.dataset.k; const st = loadAudioSettings();
    if (k) { st[k] = +e.target.value / 100; e.target.nextElementSibling.textContent = e.target.value; }
    if (e.target.id === 'suMute') st.muted = e.target.checked;
    saveAudioSettings(st); btn.textContent = st.muted || st.master === 0 ? '🔇' : '🔊';
  });
  btn.addEventListener('click', () => { draw(); pop.classList.toggle('show'); });
  document.addEventListener('click', e => { if (!e.target.closest('.su-audio')) pop.classList.remove('show'); });
  draw();
</script>
</body>
</html>
